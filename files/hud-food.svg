<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Crossed fork and spoon">
  <title>Food</title>
  <desc>A fork and spoon crossed at right angles — a diet-neutral meals symbol. Nourishment HUD icon for Focus Forge.</desc>
  <!-- Spoon (teal), one diagonal -->
  <g transform="rotate(45 32 32)">
    <rect x="29.5" y="9" width="5" height="46" rx="2.5" fill="#7dd3c0"/>
    <ellipse cx="32" cy="15" rx="8" ry="11" fill="#7dd3c0"/>
    <ellipse cx="32" cy="15" rx="4.5" ry="7" fill="#5fb3a3"/>
  </g>
  <!-- Fork (slate), other diagonal -->
  <g transform="rotate(-45 32 32)">
    <rect x="29.5" y="9" width="5" height="46" rx="2.5" fill="#cbd5e1"/>
    <path d="M25 9 L25 21 Q25 25 29 25 L29 9 Z" fill="#cbd5e1"/>
    <path d="M30 9 L30 25 L34 25 L34 9 Z" fill="#cbd5e1"/>
    <path d="M35 9 L35 25 Q39 25 39 21 L39 9 Z" fill="#cbd5e1"/>
    <rect x="25" y="8" width="14" height="4" rx="2" fill="#cbd5e1"/>
  </g>
</svg>
