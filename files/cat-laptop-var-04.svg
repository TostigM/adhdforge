<?xml version="1.0" encoding="UTF-8"?>
<!--
  Biddy Animation: Cat / Laptop / VARIATION 04 (pause & glance)
  Paws rest still on the keyboard; the cat pauses, ear twitches, head tilts to glance aside, then back.
  A "thinking / lost the thread for a moment" beat. Shared base identical to cat-laptop-main.svg.
-->
<svg width="240" height="232" viewBox="30 30 240 232" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Biddy cat pausing and glancing aside at laptop">
  <title>Biddy Cat — pause and glance</title>
  <desc>A cat at its laptop pauses typing, twitches an ear, and tilts its head to glance aside before returning. Tail sways, eyes blink.</desc>
  <style>
    @keyframes earTwitch { 0%,40%,100%{transform:rotate(0deg);} 46%{transform:rotate(-9deg);} 52%{transform:rotate(0deg);} 58%{transform:rotate(-6deg);} 64%{transform:rotate(0deg);} }
    @keyframes glanceTilt { 0%,100%{transform:rotate(0deg) translateY(0);} 35%{transform:rotate(-4deg) translateY(-1px);} 70%{transform:rotate(3deg) translateY(-1px);} }
    @keyframes tl { 0%,100%{transform:rotate(0deg);} 50%{transform:rotate(12deg);} }
    @keyframes bl { 0%,90%,100%{transform:scaleY(1);} 94%{transform:scaleY(0.08);} }
    .v-ear{animation:earTwitch 4.5s ease-in-out infinite;transform-origin:178px 70px;}
    .v-glance{animation:glanceTilt 5s ease-in-out infinite;transform-origin:150px 110px;}
    .tl{animation:tl 4.3s ease-in-out infinite;transform-origin:188px 140px;}
    .ey{animation:bl 5s ease-in-out infinite;transform-origin:140px 102px;}
    @media (prefers-reduced-motion:reduce){.v-ear,.v-glance,.tl,.ey{animation:none;}}
  </style>

  <ellipse cx="150" cy="232" rx="100" ry="26" fill="#0f172a" opacity="0.32"/>

  <g class="tl">
    <path d="M180 142 Q218 136 224 110 Q226 96 214 96" stroke="#c8a06a" stroke-width="13" fill="none" stroke-linecap="round"/>
  </g>

  <!-- head group tilts as one (glance) -->
  <g class="v-glance">
    <path d="M126 86 L114 56 L139 72 Z" fill="#c8a06a"/>
    <!-- right ear twitches independently -->
    <g class="v-ear">
      <path d="M170 82 L186 56 L160 72 Z" fill="#c8a06a"/>
      <path d="M168 78 L181 62 L159 72 Z" fill="#9a6f48"/>
    </g>
    <path d="M129 82 L124 64 L139 74 Z" fill="#9a6f48"/>
    <ellipse cx="148" cy="94" rx="40" ry="34" fill="#c8a06a"/>
    <path d="M120 90 Q128 120 148 124 Q140 102 130 90 Z" fill="#b08a56" opacity="0.5"/>
    <ellipse cx="132" cy="106" rx="20" ry="14" fill="#dab87f" opacity="0.65"/>
    <g class="ey">
      <ellipse cx="126" cy="102" rx="3.5" ry="5" fill="#1e293b"/>
      <ellipse cx="142" cy="101" rx="3.5" ry="5" fill="#1e293b"/>
    </g>
    <path d="M122 112 L125 116 L129 112 Z" fill="#c76f7a" opacity="0.9"/>
    <ellipse cx="120" cy="110" rx="5" ry="3" fill="#f4a3a8" opacity="0.4"/>
    <line x1="118" y1="106" x2="100" y2="103" stroke="#cbd5e1" stroke-width="1" stroke-linecap="round"/>
    <line x1="118" y1="111" x2="100" y2="113" stroke="#cbd5e1" stroke-width="1" stroke-linecap="round"/>
  </g>

  <g>
    <path d="M108 176 L186 198 L208 188 L130 166 Z" fill="#cdd2d8"/>
    <path d="M186 198 L208 188 L150 214 L132 206 Z" fill="#b4bac1"/>
    <ellipse cx="170" cy="198" rx="7" ry="3" fill="#aab0b8"/>
    <path d="M108 176 L130 166 L130 120 L108 130 Z" fill="#5f6874"/>
    <path d="M130 166 L130 120 L124 117 L124 163 Z" fill="#4c545f"/>
    <path d="M112 173 L127 166 L127 124 L112 131 Z" fill="#717b88"/>
  </g>

  <!-- OVERLAY (var-04): both paws rest still -->
  <ellipse cx="138" cy="184" rx="8.5" ry="5.5" fill="#c8a06a"/><ellipse cx="138" cy="186" rx="5.5" ry="3" fill="#dab87f"/>
  <ellipse cx="168" cy="192" rx="8.5" ry="5.5" fill="#c8a06a"/><ellipse cx="168" cy="194" rx="5.5" ry="3" fill="#dab87f"/>
</svg>
